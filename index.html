// ---------- Modal de venda rápida (avulsa) ----------
function ModalVendaRapida({ products, onClose, onConfirmar }) {
  const [step, setStep] = useState('itens'); // 'itens' | 'pagamento'
  const [cart, setCart] = useState([]); // { productId, nome, preco, custo, qtd, estoqueDisponivel }
  const [pagamentos, setPagamentos] = useState([]);
  const [valido, setValido] = useState(false);
  const [desconto, setDesconto] = useState(0);
  const [observacao, setObservacao] = useState('');

  const total = cart.reduce((a, it) => a + it.preco * it.qtd, 0);
  const qtdTotal = cart.reduce((a, it) => a + it.qtd, 0);

  const addProduto = (p) => {
    setCart(prev => {
      const existing = prev.find(it => it.productId === p.id);
      const jaNoCarrinho = existing ? existing.qtd : 0;
      if (jaNoCarrinho + 1 > p.qtd) return prev; // sem estoque suficiente
      if (existing) return prev.map(it => it.productId === p.id ? { ...it, qtd: it.qtd + 1 } : it);
      return [...prev, { productId: p.id, nome: p.nome, preco: p.preco, custo: p.custo, qtd: 1 }];
    });
  };

  const ajustarQtd = (productId, delta) => {
    setCart(prev => {
      const item = prev.find(it => it.productId === productId);
      const prod = products.find(p => p.id === productId);
      if (!item) return prev;
      if (delta > 0 && prod && item.qtd + delta > prod.qtd) return prev;
      const novaQtd = item.qtd + delta;
      if (novaQtd <= 0) return prev.filter(it => it.productId !== productId);
      return prev.map(it => it.productId === productId ? { ...it, qtd: novaQtd } : it);
    });
  };

  const removerDoCarrinho = (productId) => setCart(prev => prev.filter(it => it.productId !== productId));

  const confirmar = () => {
    if (!valido || cart.length === 0) return;
    onConfirmar(cart, pagamentos, desconto, observacao);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal modal-lg" onClick={e => e.stopPropagation()}>
        <h3>Venda rápida</h3>

        <div className="step-tabs">
          <div className={step === 'itens' ? 'active-step' : ''} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="step-dot">1</span> Produtos
          </div>
          <div className="sep"></div>
          <div className={step === 'pagamento' ? 'active-step' : ''} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="step-dot">2</span> Pagamento
          </div>
        </div>

        {step === 'itens' && (
          <div>
            <div className="prod-grid" style={{ maxHeight: 260, overflowY: 'auto', marginBottom: 14 }}>
              {products.map(p => {
                const noCarrinho = cart.find(it => it.productId === p.id);
                const restante = p.qtd - (noCarrinho ? noCarrinho.qtd : 0);
                const out = restante <= 0;
                return (
                  <button key={p.id} className={`prod-btn ${out ? 'out' : ''}`} onClick={() => addProduto(p)}>
                    <span className="prod-stock">{out ? 'zerado' : `${restante} un`}</span>
                    <div className="prod-name">{p.nome}</div>
                    <div className="prod-price">{formatBRL(p.preco)}</div>
                  </button>
                );
              })}
            </div>

            {cart.length === 0 ? (
              <div className="empty-state" style={{ padding: '14px 10px' }}>
                <p>Toque em um produto acima para adicionar</p>
              </div>
            ) : (
              <div style={{ background: 'var(--creme)', borderRadius: 12, padding: '4px 14px' }}>
                {cart.map(it => (
                  <div className="mini-cart-row" key={it.productId}>
                    <div style={{ minWidth: 0 }}>
                      <div className="item-row-name">{it.nome}</div>
                      <div className="item-row-price">{formatBRL(it.preco)} / un</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div className="stepper">
                        <button className="step-btn" onClick={() => ajustarQtd(it.productId, -1)}>−</button>
                        <span className="step-qty">{it.qtd}</span>
                        <button className="step-btn" onClick={() => ajustarQtd(it.productId, 1)}>+</button>
                      </div>
                      <div className="item-row-total">{formatBRL(it.preco * it.qtd)}</div>
                      <button className="btn-danger-ghost" onClick={() => removerDoCarrinho(it.productId)}>×</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="comanda-total-bar" style={{ marginTop: 14 }}>
              <span className="label">Total ({qtdTotal} {qtdTotal === 1 ? 'item' : 'itens'})</span>
              <span className="value">{formatBRL(total)}</span>
            </div>

            <div className="modal-actions">
              <button className="btn btn-outline btn-full" onClick={onClose}>Cancelar</button>
              <button className="btn btn-verde btn-full" disabled={cart.length === 0} onClick={() => setStep('pagamento')}>Ir para pagamento</button>
            </div>
          </div>
        )}

        {step === 'pagamento' && (
          <div>
            <PagamentoForm total={total} onValidChange={(p, v, d, obs) => { setPagamentos(p); setValido(v); setDesconto(d); setObservacao(obs); }} />
            <div className="modal-actions">
              <button className="btn btn-outline btn-full" onClick={() => setStep('itens')}>Voltar</button>
              <button className="btn btn-verde btn-full" disabled={!valido} onClick={confirmar}>Confirmar recebimento</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Dashboard ----------
function TelaDashboard({ faturamento, lucro, itens, ticketMedio, produtoTop, vendas, porMetodo, comandasAbertas, estoqueBaixo, valorEstoque, onDesfazer, dataSelecionada, onMudarData, caixasFechados, caixaAtual, onReabrirCaixa }) {
  const isHoje = dataSelecionada === dateToInputValue(new Date());
  const sufixo = isHoje ? ' hoje' : '';
  const [showRelatorio, setShowRelatorio] = useState(false);
  return (
    <div>
      <div className="dashboard-header">
        <div>
          <div className="section-title" style={{ marginBottom: 2 }}>Painel de vendas</div>
          <div className="section-sub titulo-data">{formatDataLabel(dataSelecionada)}{isHoje ? ' · hoje' : ''}</div>
        </div>
        <div className="date-nav">
          <button className="date-arrow" onClick={() => onMudarData(shiftDate(dataSelecionada, -1))}>‹</button>
          <input type="date" value={dataSelecionada} max={dateToInputValue(new Date())} onChange={e => e.target.value && onMudarData(e.target.value)} />
          <button className="date-arrow" onClick={() => onMudarData(shiftDate(dataSelecionada, 1))} disabled={isHoje}>›</button>
          {!isHoje && <button className="btn btn-outline btn-sm" onClick={() => onMudarData(dateToInputValue(new Date()))}>Hoje</button>}
          <button className="btn btn-primary btn-sm" onClick={() => setShowRelatorio(true)}>
            <svg viewBox="0 0 24 24" fill="none" style={{ width: 14, height: 14 }}><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M14 3v5h5M9 13h6M9 17h6M9 9h1" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
            Relatório do dia
          </button>
        </div>
      </div>

      <div className="stat-grid">
        <div className="stat-card destaque">
          <div className="stat-label">Faturamento{sufixo}</div>
          <div className="stat-value">{formatBRL(faturamento)}</div>
          <div className="stat-sub">{vendas.length} comandas fechadas</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Lucro estimado</div>
          <div className="stat-value">{formatBRL(lucro)}</div>
          <div className="stat-sub">Preço − custo</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Itens vendidos</div>
          <div className="stat-value">{itens}</div>
          <div className="stat-sub">Ticket médio {formatBRL(ticketMedio)}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{isHoje ? 'Comandas abertas agora' : 'Produto mais vendido'}</div>
          <div className="stat-value" style={{ fontSize: isHoje ? 25 : 19 }}>{isHoje ? comandasAbertas : (produtoTop ? produtoTop[0] : '—')}</div>
          <div className="stat-sub">{isHoje ? (produtoTop ? `Top: ${produtoTop[0]}` : 'Sem vendas ainda') : (produtoTop ? `${produtoTop[1]} unidades` : 'Sem vendas neste dia')}</div>
        </div>
      </div>

      <div className="stat-grid" style={{ marginBottom: 20 }}>
        <div className="method-stat">
          <div className="method-stat-icon"><IconCash /></div>
          <div>
            <div className="method-stat-label">Dinheiro</div>
            <div className="method-stat-value">{formatBRL(porMetodo.dinheiro)}</div>
          </div>
        </div>
        <div className="method-stat">
          <div className="method-stat-icon"><IconPix /></div>
          <div>
            <div className="method-stat-label">Pix</div>
            <div className="method-stat-value">{formatBRL(porMetodo.pix)}</div>
          </div>
        </div>
        <div className="method-stat">
          <div className="method-stat-icon"><IconCard /></div>
          <div>
            <div className="method-stat-label">Débito</div>
            <div className="method-stat-value">{formatBRL(porMetodo.debito)}</div>
          </div>
        </div>
        <div className="method-stat">
          <div className="method-stat-icon"><IconCard /></div>
          <div>
            <div className="method-stat-label">Crédito</div>
            <div className="method-stat-value">{formatBRL(porMetodo.credito)}</div>
          </div>
        </div>
      </div>

      <div className="grid-2">
        <div className="card panel">
          <div className="section-title">Extrato {isHoje ? 'de hoje' : `de ${formatDataCurta(dataSelecionada)}`}</div>
          <div className="scroll-y">
            {vendas.length === 0 && (
              <div className="empty-state">
                <p>{isHoje ? 'O painel se preenche conforme as comandas forem fechadas' : 'Nenhuma comanda fechada nesse dia'}</p>
              </div>
            )}
            {vendas.map(s => (
              <div className="feed-item" key={s.id}>
                <div className="feed-left">
                  <div className="feed-dot"></div>
                  <div style={{ minWidth: 0 }}>
                    <div className="feed-name">{s.nome}{s.mesa ? ` · ${s.mesa}` : ''}</div>
                    <div className="feed-meta">
                      {formatTime(s.ts)} · {s.itens.length} {s.itens.length === 1 ? 'item' : 'itens'}
                      {s.desconto > 0 ? ` · desconto de ${formatBRL(s.desconto)}` : ''}
                    </div>
                    <div className="feed-produtos">
                      {s.itens.map(it => (
                        <span className="feed-produto-badge" key={it.id}>{it.qtd}× {it.nome}</span>
                      ))}
                    </div>
                    {s.observacao && (
                      <div className="feed-obs">"{s.observacao}"</div>
                    )}
                  </div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="feed-value">+{formatBRL(s.total)}</div>
                    <button className="btn-danger-ghost" onClick={() => onDesfazer(s.id)}>desfazer</button>
                  </div>
                  <div className="pay-badges-wrap">
                    {s.pagamentos.map((p, i) => (
                      <span key={i} className={`pay-badge ${METODOS[p.metodo].cls}`}>{METODOS[p.metodo].label}{s.pagamentos.length > 1 ? ` ${formatBRL(p.valor)}` : ''}</span>
                    ))}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="card panel">
            <div className="section-title">Estoque baixo</div>
            {estoqueBaixo.length === 0 && (
              <div className="empty-state">
                <p style={{ color: 'var(--verde)' }}>Tudo dentro do nível mínimo</p>
              </div>
            )}
            {estoqueBaixo.map(p => (
              <div className="feed-item" key={p.id}>
                <div className="feed-name">{p.nome}</div>
                <span className="qty-badge low">{p.qtd} un</span>
              </div>
            ))}
          </div>

          <div className="card panel" style={{ marginTop: 16 }}>
            <div className="section-title">Valor em estoque</div>
            <div className="stat-value" style={{ color: 'var(--madeira)' }}>{formatBRL(valorEstoque)}</div>
            <div className="stat-sub" style={{ color: '#8a7a68' }}>Calculado pelo custo dos produtos</div>
          </div>

          {caixasFechados && caixasFechados.length > 0 && (
            <div className="card panel" style={{ marginTop: 16 }}>
              <div className="section-title">Histórico de caixa</div>
              <div className="scroll-y" style={{ maxHeight: 260 }}>
                {caixasFechados.slice(0, 10).map(c => (
                  <div className="feed-item" key={c.id}>
                    <div style={{ minWidth: 0 }}>
                      <div className="feed-name">{formatTime(c.abertoEm)} — {formatTime(c.fechadoEm)}</div>
                      <div className="feed-meta">
                        troco {formatBRL(c.trocoInicial)} · {c.vendas} {c.vendas === 1 ? 'venda' : 'vendas'} · faturou {formatBRL(c.totalVendas)}
                      </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
                      <span className={`caixa-diff-badge ${Math.abs(c.diferenca) < 0.01 ? 'ok' : (c.diferenca > 0 ? 'sobra' : 'falta')}`}>
                        {Math.abs(c.diferenca) < 0.01 ? 'confere' : (c.diferenca > 0 ? `+${formatBRL(c.diferenca)}` : `-${formatBRL(Math.abs(c.diferenca))}`)}
                      </span>
                      <button
                        className="btn-verde-ghost"
                        disabled={!!caixaAtual}
                        title={caixaAtual ? 'Feche o caixa atual antes de reabrir outro' : 'Reabrir este caixa'}
                        onClick={() => onReabrirCaixa(c)}
                      >
                        reabrir
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {showRelatorio && (
        <ModalRelatorio
          dataSelecionada={dataSelecionada}
          faturamento={faturamento}
          lucro={lucro}
          itens={itens}
          ticketMedio={ticketMedio}
          produtoTop={produtoTop}
          vendas={vendas}
          porMetodo={porMetodo}
          estoqueBaixo={estoqueBaixo}
          caixasFechados={caixasFechados}
          onClose={() => setShowRelatorio(false)}
        />
      )}
    </div>
  );
}

// ---------- Estoque ----------
function TelaEstoque({ products, onUpdateStock, onAddProduct, onEditProduct, onDelete }) {
  const emptyForm = { nome: '', preco: '', custo: '', qtd: '', minimo: '' };
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [buscaEstoque, setBuscaEstoque] = useState('');

  const productsFiltrados = useMemo(() => {
    const termo = buscaEstoque.trim().toLowerCase();
    if (!termo) return products;
    return products.filter(p => p.nome.toLowerCase().includes(termo));
  }, [products, buscaEstoque]);

  const abrirNovo = () => { setEditingId(null); setForm(emptyForm); setShowForm(true); };
  const abrirEdicao = (p) => {
    setEditingId(p.id);
    setForm({ nome: p.nome, preco: String(p.preco), custo: String(p.custo), qtd: String(p.qtd), minimo: String(p.minimo) });
    setShowForm(true);
  };
  const fecharForm = () => { setShowForm(false); setEditingId(null); setForm(emptyForm); };

  const submit = () => {
    if (!form.nome || !form.preco || form.qtd === '') return;
    const data = {
      nome: form.nome,
      preco: parseFloat(form.preco) || 0,
      custo: parseFloat(form.custo) || 0,
      qtd: parseInt(form.qtd) || 0,
      minimo: parseInt(form.minimo) || 0,
    };
    if (editingId) {
      onEditProduct(editingId, data);
    } else {
      onAddProduct(data);
    }
    fecharForm();
  };

  return (
    <div>
      <div className="card panel">
        <div className="section-title">
          <span>Produtos cadastrados</span>
          <button className="btn btn-primary btn-sm" onClick={() => (showForm ? fecharForm() : abrirNovo())}>
            {showForm ? 'Fechar' : '+ Novo produto'}
          </button>
        </div>

        <div className="prod-search-wrap" style={{ marginBottom: 16 }}>
          <svg viewBox="0 0 24 24" fill="none" className="prod-search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          <input
            type="text"
            className="prod-search-input"
            placeholder="Buscar produto..."
            value={buscaEstoque}
            onChange={e => setBuscaEstoque(e.target.value)}
          />
          {buscaEstoque && (
            <button className="prod-search-clear" onClick={() => setBuscaEstoque('')} aria-label="Limpar busca">×</button>
          )}
        </div>

        {showForm && (
          <div style={{ background: 'var(--creme)', padding: 16, borderRadius: 12, marginBottom: 16 }}>
            {editingId && <div className="section-sub" style={{ marginBottom: 10, fontWeight: 700, color: 'var(--cobre)' }}>Editando produto</div>}
            <div className="form-row">
              <div className="form-field" style={{ flex: 2 }}>
                <label>Nome do produto</label>
                <input value={form.nome} onChange={e => setForm({ ...form, nome: e.target.value })} placeholder="Ex: Cachaça Envelhecida" />
              </div>
              <div className="form-field">
                <label>Preço de venda</label>
                <input type="number" value={form.preco} onChange={e => setForm({ ...form, preco: e.target.value })} placeholder="0,00" />
              </div>
            </div>
            <div className="form-row">
              <div className="form-field">
                <label>Custo unitário</label>
                <input type="number" value={form.custo} onChange={e => setForm({ ...form, custo: e.target.value })} placeholder="0,00" />
              </div>
              <div className="form-field">
                <label>{editingId ? 'Quantidade em estoque' : 'Quantidade inicial'}</label>
                <input type="number" value={form.qtd} onChange={e => setForm({ ...form, qtd: e.target.value })} placeholder="0" />
              </div>
              <div className="form-field">
                <label>Estoque mínimo</label>
                <input type="number" value={form.minimo} onChange={e => setForm({ ...form, minimo: e.target.value })} placeholder="0" />
              </div>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button className="btn btn-primary" onClick={submit}>{editingId ? 'Salvar alterações' : 'Adicionar ao estoque'}</button>
              {editingId && <button className="btn btn-outline" onClick={fecharForm}>Cancelar</button>}
            </div>
          </div>
        )}

        <div style={{ overflowX: 'auto' }}>
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Custo</th>
                <th>Qtd. em estoque</th>
                <th>Ajustar</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {productsFiltrados.map(p => {
                const low = p.qtd <= p.minimo;
                return (
                  <tr key={p.id}>
                    <td style={{ fontWeight: 700 }}>{p.nome}</td>
                    <td>{formatBRL(p.preco)}</td>
                    <td style={{ color: '#8a7a68' }}>{formatBRL(p.custo)}</td>
                    <td><span className={`qty-badge ${low ? 'low' : ''}`}>{p.qtd} un</span></td>
                    <td>
                      <div className="stepper">
                        <button className="step-btn" onClick={() => onUpdateStock(p.id, -1)}>−</button>
                        <button className="step-btn" onClick={() => onUpdateStock(p.id, 1)}>+</button>
                        <button className="step-btn" style={{ width: 'auto', padding: '0 8px', fontSize: 11 }} onClick={() => onUpdateStock(p.id, 10)}>+10</button>
                      </div>
                    </td>
                    <td>
                      <div className="row-actions">
                        <button className="btn-edit-ghost" onClick={() => abrirEdicao(p)}>editar</button>
                        <button className="btn-danger-ghost" onClick={() => onDelete(p.id)}>remover</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {products.length === 0 && (
            <div className="empty-state">
              <p>Nenhum produto ainda — adicione o primeiro acima</p>
            </div>
          )}
          {products.length > 0 && productsFiltrados.length === 0 && (
            <div className="empty-state">
              <p>Nenhum produto encontrado para "{buscaEstoque}"</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
